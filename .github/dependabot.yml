# Labels are omitted on purpose. A custom `labels` list replaces Dependabot's
# defaults, and any name that is not already on the repo is dropped. With no
# list, Dependabot creates and applies `dependencies` plus the ecosystem label
# (`npm`, `github-actions`, or `docker`).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
          - "@remix-run/*"
      testing:
        patterns:
          - "@playwright/*"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
      aws:
        patterns:
          - "@aws-sdk/*"
      conform:
        patterns:
          - "@conform-to/*"
      dnd:
        patterns:
          - "@dnd-kit/*"
      sentry:
        patterns:
          - "@sentry/*"
      serwist:
        patterns:
          - "serwist"
          - "@serwist/*"
      radix:
        patterns:
          - "@radix-ui/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      webauthn:
        patterns:
          - "@simplewebauthn/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  # Scans other/Dockerfile (FROM and COPY --from). The pinned yt-dlp release
  # URL in that file is not an image reference, so it stays a manual bump.
  - package-ecosystem: "docker"
    directory: "/other"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
